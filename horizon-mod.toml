id = "rftoolsbuilder"
name = "RFTools Builder"
version = "0.2.9"
description = """RFTools Builder for Horizon: the Builder block and its shape cards. A card carries a
shape (box, sphere, cylinder, capped cylinder, prism, cone, top and bottom dome, torus, heart) or
one of the quarry card types (normal, silk touch, fortune, and their clearing variants) or the void
card, its size,
its offset and whether the shape is solid or hollow; the Builder walks that shape from the top and
either places a block into each replaceable cell or, for a quarry, breaks the block there, collects
its drops into a container above or below it and leaves the replacement block behind (or air, when
the card clears), at the jar's eight cells a tick. A quarry card's void list removes blocks without
collecting them, and the Builder's replacement block is settable. A quarry card registers its own
ticket controller and force-loads the unloaded chunk it is quarrying, releasing the ticket when the
pass ends. The Builder holds an FE buffer and pays the jar's base cost per acted cell (500 build,
300 quarry, 250 void), suspending with 'not enough power' when it cannot pay. A filter can allow or
deny a block id or tag: a filtered-out cell costs the jar's builderRfPerSkipped 50 FE and is never
built, and the same filter also applies to quarry cards: a denied block is left in place, its drops are not collected, and it costs the jar's 50 FE skip. /rftoolsbuilder status reads a Builder's card, replacement and progress back, /rftoolsbuilder
energy reads its buffer and spend, /rftoolsbuilder charge fills it, /rftoolsbuilder filter authors
the filter, and /rftoolsbuilder forced reads the chunks its ticket holds. A pump card moves each
water or lava source in its shape into the Builder's own fluid tank (and the same filter applies to
quarry cards), one whole 1000 mB bucket per cell, charging the jar's builderRfPerLiquid 300 FE; a
liquid card places a bucket of fluid from the tank into each replaceable cell, and /rftoolsbuilder
fluid reads the tank's exact millibuckets back. The movers, shields, space chamber, composer,
projector and scanner are not carried."""
authors = ["McJty"]
# A native mod: Rust in src/, compiled by the launcher against the game build [native] pins,
# beside data/ and assets/. The id is the resource namespace and the only identity: Cargo's
# package name and version are not the mod's.
api = "0.2"
# "both" is the installation side, not a hook's: an integrated server belongs to the client
# installation, so a LAN host or a single-player world needs both.
side = "both"
# The one shared value every manifest carries ("May add blocks, items, mob effects and entity
# types"): the Builder block, the shape card item, the creative tab and the two recipes are
# content this package registers.
capabilities = ["registries"]
license = "MIT"
homepage = "https://github.com/McJtyMods/RFToolsBuilder"
issues = "https://github.com/McJtyMods/RFToolsBuilder/issues"

[native]
game = "26.3"
horizon = "0a875da91dbb0fdcb7ba8c42c11341aa229af51a"
mixins = "e59da9094f0c2fdda6c627fe9eff22dec6a906f0"
